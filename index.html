<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather App</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow-x: hidden;

            transition:
                background 0.8s ease;

            /* MOR RENK KALDIRILDI */
            background: #87ceeb;
        }

        /* GÜNDÜZ */

        body.day {
            background:
                linear-gradient(
                    135deg,
                    #2980b9,
                    #6dd5fa
                );

            color: #172033;
        }

        /* GECE */

        body.night {
            background: #182848;
            color: white;
        }

        /* YAĞMUR */

        body.rain {
            background:
                linear-gradient(
                    135deg,
                    #3f4c5a,
                    #687583
                );

            color: white;
        }

        /* KAR */

        body.snow {
            background:
                linear-gradient(
                    135deg,
                    #83a4d4,
                    #b6fbff
                );

            color: #172033;
        }

        /* FIRTINA */

        body.storm {
            background:
                linear-gradient(
                    135deg,
                    #20242b,
                    #394554
                );

            color: white;
        }

        /* ANA SAYFA */

        .page {
            width: 100%;
            min-height: 100vh;

            padding:
                30px 50px;
        }

        /* ÜST MENÜ */

        header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        /* LOGO */

        .logo {
            font-size: 30px;

            font-weight: 800;

            letter-spacing: 1px;
        }

        .logo span {
            opacity: 0.65;
        }

        /* KONTROLLER */

        .controls {
            display: flex;

            gap: 10px;

            align-items: center;
        }

        /* ARAMA KUTUSU */

        .search-box {
            display: flex;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            border-radius: 12px;

            overflow: hidden;

            height: 45px;

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.1
                );
        }

        .search-box input {
            width: 230px;

            border: none;

            outline: none;

            padding:
                0 15px;

            font-size: 14px;

            color: #222;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .search-box button {
            border: none;

            background: #2575fc;

            color: white;

            padding:
                0 20px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .search-box button:hover {
            background: #125bd6;
        }

        .search-box button:active {
            transform:
                scale(0.97);
        }

        /* DERECE BUTONU */

        .unit-button {
            height: 45px;

            border: none;

            padding:
                0 17px;

            border-radius: 12px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            color: #222;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;

            transition:
                0.2s ease;
        }

        .unit-button:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );
        }

        /* HATA MESAJI */

        .error {
            max-width: 1450px;

            margin:
                0 auto 20px;

            background:
                rgba(
                    231,
                    76,
                    60,
                    0.22
                );

            border:
                1px solid
                rgba(
                    231,
                    76,
                    60,
                    0.5
                );

            padding: 14px;

            border-radius: 12px;

            text-align: center;

            display: none;

            font-size: 14px;
        }

        /* LOADING GİZLİ */

        .loading {
            display: none !important;
        }

        /* DASHBOARD */

        .dashboard {
            display: grid;

            grid-template-columns:
                420px 1fr;

            gap: 25px;

            max-width: 1450px;

            margin: auto;
        }

        /* CAM EFEKTİ */

        .glass {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.14
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );
        }

        /* ANA HAVA KARTI */

        .main-weather {
            padding: 35px;

            min-height: 580px;

            display: flex;

            flex-direction: column;

            justify-content:
                space-between;
        }

        /* ŞEHİR */

        .location {
            font-size: 32px;

            font-weight: 700;
        }

        .country {
            margin-top: 5px;

            opacity: 0.7;

            font-size: 14px;
        }

        /* ANA HAVA */

        .weather-main {
            text-align: center;

            padding:
                30px 0;
        }

        /* HAVA İKONU */

        .weather-icon {
            font-size: 110px;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 8px 15px
                    rgba(
                        0,
                        0,
                        0,
                        0.15
                    )
                );
        }

        /* SICAKLIK */

        .temperature {
            font-size: 82px;

            font-weight: 800;

            line-height: 1;
        }

        .temperature-unit {
            font-size: 35px;

            vertical-align: top;

            margin-left: 5px;
        }

        /* AÇIKLAMA */

        .description {
            font-size: 20px;

            margin-top: 15px;

            opacity: 0.9;
        }

        /* TARİH */

        .date {
            text-align: center;

            opacity: 0.7;

            font-size: 14px;
        }

        /* İSTATİSTİKLER */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-top: 25px;
        }

        .stat {
            padding: 17px;

            border-radius: 17px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }

        .stat-name {
            opacity: 0.7;

            font-size: 13px;
        }

        .stat-value {
            font-size: 15px;

            font-weight: bold;

            margin-top: 4px;
        }

        /* SAĞ PANEL */

        .right-panel {
            display: flex;

            flex-direction: column;

            gap: 25px;
        }

        /* BÖLÜMLER */

        .section {
            padding: 25px;
        }

        .section-title {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 18px;
        }

        /* SAATLİK */

        .hourly {
            display: grid;

            grid-template-columns:
                repeat(
                    12,
                    minmax(
                        75px,
                        1fr
                    )
                );

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 5px;
        }

        .hour {
            min-width: 75px;

            padding:
                13px 8px;

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            text-align: center;

            transition:
                0.2s ease;
        }

        .hour:hover {
            transform:
                translateY(-3px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.16
                );
        }

        .hour-time {
            font-size: 12px;

            opacity: 0.65;

            margin-bottom: 10px;
        }

        .hour-icon {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .hour-temp {
            font-size: 15px;

            font-weight: bold;
        }

        .hour-rain {
            font-size: 10px;

            opacity: 0.65;

            margin-top: 5px;
        }

        /* 7 GÜNLÜK */

        .forecast {
            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    1fr
                );

            gap: 10px;
        }

        .day-card {
            padding:
                18px 10px;

            border-radius: 17px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            text-align: center;

            transition:
                0.2s ease;
        }

        .day-card:hover {
            transform:
                translateY(-4px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.16
                );
        }

        .day-name {
            font-size: 13px;

            font-weight: bold;

            margin-bottom: 12px;
        }

        .day-icon {
            font-size: 35px;

            margin-bottom: 12px;
        }

        .day-temp {
            font-size: 14px;

            font-weight: bold;
        }

        .day-min {
            opacity: 0.5;

            margin-left: 4px;
        }

        .day-rain {
            font-size: 11px;

            opacity: 0.65;

            margin-top: 9px;
        }

        /* YAĞMUR / KAR ANİMASYONU */

        .weather-animation {
            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: -1;
        }

        /* YAĞMUR */

        .raindrop {
            position: absolute;

            width: 2px;

            height: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            animation:
                rainFall linear infinite;
        }

        @keyframes rainFall {

            from {
                transform:
                    translateY(-50px);
            }

            to {
                transform:
                    translateY(110vh);
            }

        }

        /* KAR */

        .snowflake {
            position: absolute;

            color: white;

            font-size: 18px;

            animation:
                snowFall linear infinite;
        }

        @keyframes snowFall {

            from {
                transform:
                    translateY(-50px)
                    rotate(0deg);
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(360deg);
            }

        }

        /* SCROLLBAR */

        ::-webkit-scrollbar {
            height: 7px;

            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            border-radius: 10px;
        }

        /* TABLET */

        @media (max-width: 1200px) {

            .page {
                padding: 25px;
            }

            header {
                flex-direction:
                    column;

                gap: 20px;

                align-items:
                    flex-start;
            }

            .controls {
                width: 100%;
            }

            .dashboard {
                grid-template-columns:
                    1fr;
            }

        }

        /* TELEFON */

        @media (max-width: 700px) {

            .page {
                padding: 15px;
            }

            .controls {
                flex-direction:
                    column;

                align-items:
                    stretch;
            }

            .search-box {
                width: 100%;
            }

            .search-box input {
                width: 100%;
            }

            .unit-button {
                width: 100%;
            }

            .main-weather {
                min-height: 500px;

                padding: 25px;
            }

            .temperature {
                font-size: 60px;
            }

            .weather-icon {
                font-size: 80px;
            }

            .forecast {
                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }

    </style>

</head>


<body>


    <!-- HAVA ANİMASYONLARI -->

    <div
        id="animationLayer"
        class="weather-animation"
    ></div>


    <div class="page">


        <!-- ÜST MENÜ -->

        <header>


            <div class="logo">

                WEATHER<span>APP</span>

            </div>


            <div class="controls">


                <!-- ŞEHİR ARAMA -->

                <div class="search-box">

                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Şehir ara... Örn: Samsun"
                        autocomplete="off"
                    >

                    <button
                        id="searchButton"
                    >
                        Ara
                    </button>

                </div>


                <!-- DERECE DEĞİŞTİRME -->

                <button
                    id="unitButton"
                    class="unit-button"
                >
                    °C / °F
                </button>


            </div>


        </header>


        <!-- HATA MESAJI -->

        <div
            id="error"
            class="error"
        ></div>


        <!-- LOADING GİZLİ -->

        <div
            id="loading"
            class="loading"
        ></div>


        <!-- DASHBOARD -->

        <main
            id="dashboard"
            class="dashboard"
            style="display: none;"
        >


            <!-- ANA HAVA KARTI -->

            <section
                id="mainWeather"
                class="glass main-weather"
            >


                <!-- ŞEHİR -->

                <div>

                    <div
                        id="cityName"
                        class="location"
                    >
                        --
                    </div>

                    <div
                        id="countryName"
                        class="country"
                    >
                        Türkiye
                    </div>

                </div>


                <!-- HAVA -->

                <div class="weather-main">


                    <div
                        id="weatherIcon"
                        class="weather-icon"
                    >
                        ☀️
                    </div>


                    <div class="temperature">

                        <span
                            id="temperature"
                        >
                            --
                        </span>

                        <span
                            id="temperatureUnit"
                            class="temperature-unit"
                        >
                            °C
                        </span>

                    </div>


                    <div
                        id="description"
                        class="description"
                    >
                        --
                    </div>


                </div>


                <!-- ALT BİLGİLER -->

                <div>


                    <div
                        id="date"
                        class="date"
                    >
                        --
                    </div>


                    <div class="stats">


                        <!-- HİSSEDİLEN -->

                        <div class="stat">

                            <div>

                                <div
                                    class="stat-name"
                                >
                                    Hissedilen
                                </div>

                                <div
                                    id="feelsLike"
                                    class="stat-value"
                                >
                                    --
                                </div>

                            </div>

                            <span>
                                🌡️
                            </span>

                        </div>


                        <!-- NEM -->

                        <div class="stat">

                            <div>

                                <div
                                    class="stat-name"
                                >
                                    Nem
                                </div>

                                <div
                                    id="humidity"
                                    class="stat-value"
                                >
                                    --
                                </div>

                            </div>

                            <span>
                                💧
                            </span>

                        </div>


                        <!-- RÜZGAR -->

                        <div class="stat">

                            <div>

                                <div
                                    class="stat-name"
                                >
                                    Rüzgâr
                                </div>

                                <div
                                    id="wind"
                                    class="stat-value"
                                >
                                    --
                                </div>

                            </div>

                            <span>
                                💨
                            </span>

                        </div>


                        <!-- BASINÇ -->

                        <div class="stat">

                            <div>

                                <div
                                    class="stat-name"
                                >
                                    Basınç
                                </div>

                                <div
                                    id="pressure"
                                    class="stat-value"
                                >
                                    --
                                </div>

                            </div>

                            <span>
                                🌡️
                            </span>

                        </div>


                    </div>


                </div>


            </section>


            <!-- SAĞ PANEL -->

            <section
                class="right-panel"
            >


                <!-- SAATLİK TAHMİN -->

                <div
                    class="glass section"
                >

                    <div
                        class="section-title"
                    >
                        Saatlik Tahmin
                    </div>

                    <div
                        id="hourly"
                        class="hourly"
                    ></div>

                </div>


                <!-- 7 GÜNLÜK TAHMİN -->

                <div
                    class="glass section"
                >

                    <div
                        class="section-title"
                    >
                        7 Günlük Tahmin
                    </div>

                    <div
                        id="forecast"
                        class="forecast"
                    ></div>

                </div>


            </section>


        </main>


    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
